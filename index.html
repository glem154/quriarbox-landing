<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quariabox Courier</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oxanium:wght@700&family=Raleway:wght@400;700;800&family=Rubik:wght@400&display=swap"
        rel="stylesheet">
</head>
<header class="header">
    <div class="container header__container">
        <a class="header__logo" href="index.html">
            <img src="images/logo.svg" alt="quariabox logo" width="145" height="36">
        </a>
        <div class="header__right">
            <nav class="header__nav">
                <ul class="header__menu">
                    <li class="header__menu-item">
                        <a class="header__menu-link header__menu-link--active" href="index.html">Home</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">Our services</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">About Us</a>
                    </li>
                    <li class="header__menu-item">
                        <a class="header__menu-link" href="#">What's new?</a>
                    </li>
                </ul>
            </nav>
            <div class="header__actions">
                <button class="btn header__btn" type="button">
                    <img src="images/search.svg" alt="search">
                </button>
                <button class="btn header__btn-contact">Contact us</button>
            </div>
        </div>
    </div>
</header>

<main class="main">
    <section class="hero">
        <div class="container hero__container">
            <div class="hero__content">
                <h1 class="hero__title">A trusted provider of <span class="hero__title hero__title-bold"> courier
                        services.</span></h1>
                <p class="hero__text">We deliver your products safely to <br> your home in a reasonable time.</p>
                <a href="#" class="btn hero__btn">Get started</a>
            </div>
            <div class="hero__media">
                <img src="images/hero-Illustration.svg" alt="Courier dellivery illustration" class="hero__img">
            </div>
        </div>
    </section>
</main>

</body>

</html>
